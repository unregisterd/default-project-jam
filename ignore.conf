# Unity Version Control (UVCS / Plastic SCM) 忽略规则
# 放在工程根目录，与 Assets/ 平级；UVCS 建工作区时自动读取
# 语法：一行一条，支持 * 和 ?，# 开头为注释

# Unity 生成目录
Library
Temp
Logs
obj
Build
Builds
UserSettings
MemoryCaptures
Recordings
CrashReports

# 编辑器 / IDE
.vs
.idea
.vscode
.gradle
.consulo
ExportedObj

# 自动生成的工程文件
*.csproj
*.unityproj
*.sln
*.suo
*.user
*.userprefs
*.pidb
*.booproj
*.svd
*.pdb
*.mdb
*.opendb
*.VC.db
*.pidb.meta
*.pdb.meta
*.mdb.meta

# 崩溃 / 打包产物
sysinfo.txt
*.apk
*.aab
*.unitypackage
*.app

# 旧 Git 仓库（保留作备份，不让 UVCS 收录）
.git
.gitignore
.gitattributes

# UVCS 自身工作区元数据
.plastic

# 系统垃圾
.DS_Store
Thumbs.db
desktop.ini
